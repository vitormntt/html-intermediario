<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>


    <h1>Mais sobre tabelas</h1>
    <!--
        caption -> legenda / titutlo da tabela
        thead -> table header (cabeçalho da tabela)
        tbody -> table body (corpo da tabela)
        tfppt -> table footer (rodape da tabela)
    -->
    <table border="1">
        <caption>Listagem de Produtos</caption>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Preço</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Livro</td>
                <td>1</td>
                <td>R$ 230</td>
            </tr>
            <tr>
                <td>Fone de Ouvido</td>
                <td>2</td>
                <td>R$ 500</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td>Total</td>
                <td colspan="2">R$ 1230</td>
            </tr>
        </tfoot>

    </table>


</body>
</html>
