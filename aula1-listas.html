<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas Ordenadas e não ordenadas</title>
</head>
<body>
    
    <!--
    ul -> Unordered List (lista não ordenada)
    ol -> Ordered List (Lista ordenada)
    li -> List Item (Item da Lista)
    -->

    <h2>Lista Não Ordenada (Menus)</h2>
    <ul style="list-style-type: style type square;;">
        <li>Veículos</li>
        <li>
            Tecnlogia
            <ul>
                <li>Celulares e Telefônes</li>
                <li>Câmeras e Acesssórios</li>
            </ul>
        </li>
    </ul>

    <h2>Lista Ordenada (Lista de compras)</h2>
    <ol style="list-style-type: decimal-leading-zero;">
        <li>Melancia</li>
        <li>Nutella</li>
        <li>Sabonete</li>
        <li>
            Miojo
            <ol>
                <li> de Carne</li>
                <li> de Frango</li>
                <li> de Tomate</li>
            </ol>
        </li>
    </ol>

</body>
</html>
