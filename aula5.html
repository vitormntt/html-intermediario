<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
</head>
<body>

    <h1>Tabelas</h1>

    <!--
        table - tabela
        tr -> table row (linha de tabela)
        td -> table data (dados da tabela) * table cell (celulas da tabela)
        th -> table header (cabeçalho da tabela)
    -->

    <!-- Não utilizar o BORDER, apenas antes de aprender
     CSS!!!
    -->
    <table border="1">
        <tr>
            <th>Produto</th>
            <th>Quantidade</th>
            <th>Preço</th>
        </tr>
        <tr>
            <td>Livro</td>
            <td>1</td>
            <td>R$ 230</td>
        </tr>
        <tr>
            <td>Fone de Ouvido</td>
            <td>2</td>
            <td>R$ 500</td>
        </tr>

        <!--
            colspan -> extensão da coluna
            rowspan -> extensão da linha
        -->
        <tr>
            <td rowspan="2">Desconto</td>
            <td colspan="2">Cupom 1 - R$ 20</td>
        </tr>
        <tr>
            <td colspan="2">Cupom 2 - R$ 20</td>
        </tr>
    </table>


</body>
</html>
